name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  # The release workflow runs these checks first and builds only if they pass.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - run: ./gradlew testDebugUnitTest assembleDebug detekt ktlintCheck

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: scripts/semgrep.sh
