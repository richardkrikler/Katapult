name: Build APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The tag is the version (v1.6-rk.1 -> 1.6-rk.1). Stamped here only, so upstream
      # version bumps never conflict when syncing. versionCode stays above upstream's.
      - name: Stamp version
        id: version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sed -i "s/^\( *versionName = \)\".*\"$/\1\"$ver\"/" app/build.gradle.kts
          sed -i "s/^\( *versionCode = \).*$/\1$((1000 + ${{ github.run_number }}))/" app/build.gradle.kts
          grep -q "versionName = \"$ver\"" app/build.gradle.kts
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # Without the keystore Gradle still builds, just unsigned, which nothing can install.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > $GITHUB_WORKSPACE/keystore.jks

      - name: Test and build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          mv app/build/outputs/apk/release/*.apk "katapult-v${{ steps.version.outputs.version }}.apk"

      # The matching "## [x]" section of CHANGELOG.md; GitHub's generated notes follow it.
      - name: Release notes
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## [" v "]" { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md > notes.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: katapult-release
          path: katapult-v*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: katapult-v*.apk
